name: 💡 功能建議 / Feature Request
description: 新功能、新主題風格或體驗改進建議 / New features, new theme styles, or UX improvement ideas
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 想解決什麼問題? / What problem are you trying to solve?
      description: 描述場景與痛點,比場景化的解決方案更有幫助 / Describe the scenario and pain point — this is more helpful than a specific proposed solution
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能形態(可選) / What would you like it to look like? (optional)
      description: 如果你已經想好了希望它長什麼樣,寫在這裡 / If you already have something in mind, describe it here
