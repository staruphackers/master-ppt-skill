name: 🐛 問題反饋 / Bug Report
description: 生成、編輯、預覽或匯出過程中遇到的錯誤 / Errors encountered during generation, editing, preview, or export
labels: [bug]
body:
  - type: dropdown
    id: stage
    attributes:
      label: 問題發生在哪個環節? / Which stage did the issue occur in?
      options:
        - 安裝/更新 skill / Install/update the skill
        - 生成 PPT(渲染失敗或內容不對) / Generate PPT (render failure or wrong content)
        - 瀏覽器內編輯/預覽 / In-browser edit/preview
        - 匯出 PDF / Export PDF
        - 匯出 PPTX / Export PPTX
        - 其他 / Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 使用環境 / Environment
      description: 作業系統 + 使用的 Agent(如 macOS + Claude Code、Windows + Codex、豆包 等) / OS + the agent you used (e.g. macOS + Claude Code, Windows + Codex, Doubao, etc.)
      placeholder: "例如: Windows 11 + Codex / e.g. Windows 11 + Codex"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill 版本 / Skill Version
      description: 安裝目錄裡 SKILL.md 的「當前版本」;不確定可以讓 AI 幫你看 / The "Current Version" field in SKILL.md inside your install directory; if unsure, ask your AI agent to check for you
      placeholder: "例如: 0.1.36 / e.g. 0.1.36"
  - type: textarea
    id: description
    attributes:
      label: 問題描述與復現步驟 / Description & steps to reproduce
      description: 做了什麼 → 期望什麼 → 實際發生了什麼 / What you did → what you expected → what actually happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 報錯資訊/截圖 / Error messages / screenshots
      description: 頁面彈窗文字、瀏覽器控制檯(F12)的紅色報錯、或終端輸出;截圖直接拖進來 / Text from an on-page dialog, red errors in the browser console (F12), or terminal output; you can drag screenshots directly into this box
  - type: checkboxes
    id: checklist
    attributes:
      label: 匯出類問題請先自查 / For export issues, please self-check first
      options:
        - label: 已確認頁面是透過 http://127.0.0.1:<埠>/ 開啟的(不是按兩下 HTML 檔案) / Confirmed the page was opened via http://127.0.0.1:<port>/ (not by double-clicking the HTML file)
        - label: 已更新到最新版 skill 並重新生成過一次 / Updated to the latest skill version and regenerated once
