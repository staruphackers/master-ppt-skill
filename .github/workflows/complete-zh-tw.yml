name: Complete Traditional Chinese Localization
on:
  push:
    branches: [localize/zh-tw-strings]
    paths: [tools/complete-zh-tw.cjs, tools/zh-tw-license-boundary.cjs, .github/workflows/complete-zh-tw.yml]
permissions:
  contents: read
concurrency:
  group: complete-zh-tw
  cancel-in-progress: false
jobs:
  complete:
    if: github.repository == 'staruphackers/master-ppt-skill' && github.ref == 'refs/heads/localize/zh-tw-strings'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PROJECT: ${{ github.workspace }}/skills/dashi-ppt/project
      QA_OUTPUT: /tmp/zh-tw-complete
      ZH_TW_TOOLS: /tmp/zh-tw-tools
      DASHI_PPT_THEME_RUNTIME: prebuilt
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install isolated test tools without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$ZH_TW_TOOLS" --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund opencc-js@1.0.5 @babel/parser@7.26.10 yaml@2.7.0
          npm ci --prefix "$PROJECT" --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Preserve original engine then complete localization
        shell: bash
        run: |
          set -euo pipefail
          node tools/complete-zh-tw.cjs
          node --check skills/dashi-ppt/scripts/check_latest_version.mjs
          node --check "$QA_OUTPUT/check.mjs"
          git diff --check
          python3 - <<'PY'
          import os,pathlib
          project=pathlib.Path(os.environ['PROJECT'])
          script=(project/'scripts/export-pptx.mjs').read_text()
          needle='if (result.warnings?.length) {'
          assert needle in script
          script=script.replace(needle,"console.log('QA_EXPORT_WARNINGS=' + JSON.stringify(result.warnings || []));\n      "+needle)
          (project/'scripts/.qa-zh-tw-export.mjs').write_text(script)
          p=pathlib.Path(os.environ['QA_OUTPUT'])/'check.mjs'
          text=p.read_text()
          assert "path.join(project,'scripts/export-pptx.mjs')" in text
          p.write_text(text.replace("path.join(project,'scripts/export-pptx.mjs')", "path.join(project,'scripts/.qa-zh-tw-export.mjs')"))
          PY
      - name: Parse Windows PowerShell scripts without executing them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checked = 0
          Get-ChildItem -Path skills -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
            $checked++
          }
          if ($checked -lt 1) { throw 'No PowerShell scripts found.' }
          @{ scriptsParsed = $checked; status = 'passed'; runtimeExecution = $false } | ConvertTo-Json | Set-Content "$env:QA_OUTPUT/powershell.json"
      - name: Exercise themes and export real files with original engine
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$PROJECT/scripts/.qa-zh-tw-export.mjs"' EXIT
          "$PROJECT/node_modules/.bin/tsx" "$QA_OUTPUT/check.mjs"
      - name: Verify files license boundaries and persist test evidence
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- LICENSE skills/dashi-ppt/project/package.json skills/dashi-ppt/project/package-lock.json
          python3 - <<'PY'
          import json, os, re, zipfile, pathlib, xml.etree.ElementTree as ET,hashlib,subprocess
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE']);out=pathlib.Path(os.environ['QA_OUTPUT'])
          results=[];ns={'a':'http://schemas.openxmlformats.org/drawingml/2006/main'}
          for file in sorted(out.glob('*.pptx')):
              with zipfile.ZipFile(file) as z:
                  assert z.testzip() is None,file.name
                  slides=[n for n in z.namelist() if re.fullmatch(r'ppt/slides/slide\d+\.xml',n)]
                  assert len(slides)==2,(file.name,slides)
                  texts=[]
                  for name in slides:texts += [el.text or '' for el in ET.fromstring(z.read(name)).findall('.//a:t',ns)]
                  assert texts,(file.name,'No editable text')
                  assert any(re.search(r'[\u3400-\u9fff]',t) for t in texts),file.name
                  assert not re.search('导出|视频|设置|编辑|点击|模块|默认|缩略|简体中文','\n'.join(texts)),file.name
                  results.append({'file':file.name,'slides':len(slides),'editableTextRuns':len(texts),'status':'passed'})
          assert len(results)==3,results
          readme=(root/'README.md').read_text()
          assert '--branch main' in readme and '重要例外' in readme and '專有元件' in readme
          assert 'releases/download/readme-assets' not in readme
          for image in re.findall(r'!\[[^\]]*\]\(([^)]+)\)',readme):assert (root/image).is_file(),image
          update=(root/'skills/dashi-ppt/scripts/check_latest_version.mjs').read_text()
          for blocked in ['registry.npmmirror.com','registry.npmjs.org','chuspeeism/']:assert blocked not in update
          (out/'pptx-xml.json').write_text(json.dumps(results,ensure_ascii=False,indent=2)+'\n')
          qa=json.loads((out/'results.json').read_text());assert qa['status']=='passed'
          warnings={}
          for log in out.glob('*-pptx.log'):
              line=next((s for s in log.read_text().splitlines() if s.startswith('QA_EXPORT_WARNINGS=')),None)
              assert line is not None,log.name
              warnings[log.stem]=json.loads(line.split('=',1)[1])
          (out/'export-warnings.json').write_text(json.dumps(warnings,ensure_ascii=False,indent=2)+'\n')
          paths=subprocess.check_output(['git','ls-files','-z','skills/dashi-ppt'],text=True).strip('\0').split('\0')
          digest=hashlib.sha256()
          for name in sorted(paths):
              p=root/name
              if p.is_file():digest.update(name.encode()+b'\0'+p.read_bytes()+b'\0')
          summary={'status':'passed','workflowRun':'https://github.com/staruphackers/master-ppt-skill/actions/runs/'+os.environ['GITHUB_RUN_ID'],
            'workflowHead':os.environ['GITHUB_SHA'],'testedSkillTreeSHA256':digest.hexdigest(),
            'environment':qa['environment'],'viewports':qa['viewports'],'themes':qa['themes'],'layouts':qa['layouts'],'controls':qa['controls'],
            'dictionaryEntries':qa['dictionaryEntries'],'browserChecks':qa['checks'],'languageToggle':qa['languageToggle'],
            'englishBrowserMode':qa['englishBrowserMode'],'mobilePanelCollapse':qa['mobilePanelCollapse'],
            'powershell':json.loads((out/'powershell.json').read_text()),'syntaxChecks':json.loads((out/'second-pass-localization.json').read_text())['syntaxCheckedCount'],
            'pptx':results,'pdf':[{'file':x['theme']+'.pdf','pages':2,'bytes':x['bytes']} for x in qa['exports'] if x['format']=='pdf'],
            'exportWarnings':warnings,'proprietaryEngine':'Chinese strings in editable source may be localized; LICENSE text remains unchanged.',
            'limitations':qa['limitations']+['English fixture tests UI language, not automatic translation of slide copy.','CLI copy adds warning logging only.','No Microsoft PowerPoint or Windows/macOS runtime round-trip.','Not a full security audit.']}
          (root/'docs/zh-TW-validation.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'status':'passed','syntaxChecks':summary['syntaxChecks'],'pptx':results,'warningCounts':{k:len(v) for k,v in warnings.items()}},ensure_ascii=False,indent=2))
          PY
          git diff --check
      - name: Preserve evidence without credentials source bundles or fonts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zh-TW-completion-evidence
          path: |
            /tmp/zh-tw-complete/*.json
            /tmp/zh-tw-complete/*.png
            /tmp/zh-tw-complete/*.pptx
            /tmp/zh-tw-complete/*.pdf
            /tmp/zh-tw-complete/*.log
          retention-days: 14
          if-no-files-found: warn
      - name: Commit only verified changes to the translation branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/localize/zh-tw-strings'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git add -u
          git add docs/assets/zh-TW docs/zh-TW-validation.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(i18n): preserve original proprietary engine and verify Traditional Chinese delivery'
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$HEADER" push origin HEAD:refs/heads/localize/zh-tw-strings-strings
          echo "Verified localization commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
