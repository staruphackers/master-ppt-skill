name: Complete Traditional Chinese Localization

on:
  push:
    branches: [localize/zh-tw]
    paths:
      - tools/complete-zh-tw.cjs
      - .github/workflows/complete-zh-tw.yml

permissions:
  contents: read

concurrency:
  group: complete-zh-tw
  cancel-in-progress: false

jobs:
  complete:
    if: github.repository == 'staruphackers/master-ppt-skill' && github.ref == 'refs/heads/localize/zh-tw'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PROJECT: ${{ github.workspace }}/skills/dashi-ppt/project
      QA_OUTPUT: ${{ runner.temp }}/zh-tw-complete
      ZH_TW_TOOLS: ${{ runner.temp }}/zh-tw-tools
      DASHI_PPT_THEME_RUNTIME: prebuilt
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out the exact reviewed branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install isolated test tools without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$ZH_TW_TOOLS" --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund opencc-js@1.0.5 @babel/parser@7.26.10 yaml@2.7.0
          npm ci --prefix "$PROJECT" --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Complete text localization and prepare regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/complete-zh-tw.cjs
          node tools/complete-zh-tw.cjs
          node --check skills/dashi-ppt/scripts/check_latest_version.mjs
          node --check "$QA_OUTPUT/check.mjs"
          git diff --check
      - name: Parse all Windows PowerShell scripts without executing them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checked = 0
          Get-ChildItem -Path skills -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
            $checked++
          }
          if ($checked -lt 1) { throw 'No PowerShell scripts found.' }
          @{ scriptsParsed = $checked; status = 'passed'; runtimeExecution = $false } | ConvertTo-Json | Set-Content "$env:QA_OUTPUT/powershell.json"
      - name: Exercise all themes and language controls, then export real files
        shell: bash
        run: |
          set -euo pipefail
          "$PROJECT/node_modules/.bin/tsx" "$QA_OUTPUT/check.mjs"
      - name: Inspect editable PPTX XML and localization delivery boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, zipfile, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          out = pathlib.Path(os.environ['QA_OUTPUT'])
          results = []
          ns = {'a':'http://schemas.openxmlformats.org/drawingml/2006/main'}
          for file in sorted(out.glob('*.pptx')):
              with zipfile.ZipFile(file) as z:
                  assert z.testzip() is None, file.name
                  slides = [n for n in z.namelist() if re.fullmatch(r'ppt/slides/slide\d+\.xml', n)]
                  assert len(slides) == 2, (file.name, slides)
                  texts = []
                  for name in slides:
                      texts += [el.text or '' for el in ET.fromstring(z.read(name)).findall('.//a:t', ns)]
                  assert texts, (file.name, 'No editable text')
                  if not file.name.startswith('english'):
                      assert any(re.search(r'[\u3400-\u9fff]', t) for t in texts), file.name
                      assert not re.search('导出|视频|设置|编辑|点击|模块|默认|缩略|简体中文', '\n'.join(texts)), file.name
                  results.append({'file':file.name,'slides':len(slides),'editableTextRuns':len(texts),'status':'passed'})
          assert len(results) == 3, results
          readme = (root/'README.md').read_text()
          assert '--branch main' in readme
          assert 'releases/download/readme-assets' not in readme
          for image in re.findall(r'!\[[^\]]*\]\(([^)]+)\)', readme):
              assert (root/image).is_file(), image
          update = (root/'skills/dashi-ppt/scripts/check_latest_version.mjs').read_text()
          assert 'registry.npmmirror.com' not in update
          assert 'registry.npmjs.org' not in update
          assert 'chuspeeism/' not in update
          (out/'pptx-xml.json').write_text(json.dumps(results,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
          git diff --quiet -- LICENSE skills/dashi-ppt/project/package.json skills/dashi-ppt/project/package-lock.json
          git diff --check
      - name: Preserve test evidence, without credentials, source bundles or fonts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zh-TW-completion-evidence
          path: |
            ${{ runner.temp }}/zh-tw-complete/*.json
            ${{ runner.temp }}/zh-tw-complete/*.png
            ${{ runner.temp }}/zh-tw-complete/*.pptx
            ${{ runner.temp }}/zh-tw-complete/*.pdf
            ${{ runner.temp }}/zh-tw-complete/*.log
          retention-days: 14
          if-no-files-found: warn
      - name: Commit only verified localization changes to the translation branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/localize/zh-tw'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git add -u
          git add docs/assets/zh-TW
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(i18n): complete Taiwan text, preview assets and fork-safe installation'
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$HEADER" push origin HEAD:refs/heads/localize/zh-tw
          echo "Verified localization commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
