name: Verify Traditional Chinese UI

on:
  push:
    branches: [localize/zh-tw]
    paths:
      - .github/workflows/qa-zh-tw.yml
      - skills/dashi-ppt/**

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locked project dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix skills/dashi-ppt/project --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund
      - name: Render all themes and verify browser interactions
        shell: bash
        env:
          PROJECT: ${{ github.workspace }}/skills/dashi-ppt/project
          QA_OUTPUT: ${{ runner.temp }}/zh-tw-qa
          DASHI_PPT_THEME_RUNTIME: prebuilt
        run: |
          set -euo pipefail
          mkdir -p "$QA_OUTPUT"
          cat > "$QA_OUTPUT/check.mjs" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import http from 'node:http';
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import { pathToFileURL } from 'node:url';
          const project = process.env.PROJECT;
          const output = process.env.QA_OUTPUT;
          const req = createRequire(path.join(project, 'package.json'));
          const { chromium } = req('playwright-core');
          const { renderDeck } = await import(pathToFileURL(path.join(project, 'src/renderDeck.jsx')));
          const { THEME_PAGES, THEME_PACK_OPTIONS } = await import(pathToFileURL(path.join(project, 'src/components/themes/index.jsx')));
          const { loadI18nDictionary, normalizeDeckLanguage } = await import(pathToFileURL(path.join(project, 'src/i18n-core.mjs')));
          const themes = Object.keys(THEME_PACK_OPTIONS).sort();
          assert.equal(themes.length, 12);
          assert.equal(THEME_PAGES.length, 1020);
          assert.equal(normalizeDeckLanguage('zh-TW'), 'zh');
          assert.equal(normalizeDeckLanguage('zh-CN'), 'zh');
          assert.equal(normalizeDeckLanguage('en-US'), 'en');
          const dictionary = loadI18nDictionary();
          for (const theme of themes) {
            assert.equal(typeof dictionary[THEME_PACK_OPTIONS[theme].label], 'string');
          }
          const results = { browserPath: 'Playwright; Browser plugin not available in this session',
            themes: themes.length, layouts: THEME_PAGES.length,
            controls: THEME_PAGES.reduce((n, p) => n + (p.controls?.length || 0), 0),
            dictionaryEntries: Object.keys(dictionary).length, checks: [] };
          const roots = new Map();
          for (const theme of themes) {
            const pages = THEME_PAGES.filter(p => p.themeKey === theme).slice(0, 2);
            const outFile = path.join(output, theme, 'index.html');
            renderDeck({ title: `繁體中文介面驗證 ${theme}`, language: 'zh-TW', themePack: theme,
              slides: pages.map((p, i) => ({ id: `qa-${theme}-${i}`, layout: p.key, props: {} })) },
              { outFile, includeThemeSwitcher: true });
            assert.match(fs.readFileSync(outFile, 'utf8'), /<html lang="zh-TW"/);
            roots.set(theme, path.dirname(outFile));
          }
          const englishFile = path.join(output, 'english', 'index.html');
          renderDeck({ title: 'English UI verification', language: 'en', themePack: themes[0],
            slides: THEME_PAGES.filter(p => p.themeKey === themes[0]).slice(0, 2).map(p => ({ layout: p.key, props: {} })) },
            { outFile: englishFile, includeThemeSwitcher: true });
          const types = { '.html': 'text/html; charset=utf-8', '.js': 'application/javascript', '.mjs': 'application/javascript',
            '.css': 'text/css', '.json': 'application/json', '.svg': 'image/svg+xml', '.png': 'image/png',
            '.jpg': 'image/jpeg', '.jpeg': 'image/jpeg', '.woff2': 'font/woff2' };
          const server = http.createServer((request, response) => {
            const pathname = decodeURIComponent(new URL(request.url, 'http://localhost').pathname);
            let target = path.resolve(output, '.' + pathname);
            if (!target.startsWith(output + path.sep)) { response.writeHead(403); response.end(); return; }
            if (fs.existsSync(target) && fs.statSync(target).isDirectory()) target = path.join(target, 'index.html');
            if (!fs.existsSync(target) || !fs.statSync(target).isFile()) { response.writeHead(404); response.end(); return; }
            response.setHeader('Content-Type', types[path.extname(target)] || 'application/octet-stream');
            fs.createReadStream(target).pipe(response);
          });
          await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
          const origin = `http://127.0.0.1:${server.address().port}`;
          const chrome = ['/usr/bin/google-chrome', '/usr/bin/google-chrome-stable', '/usr/bin/chromium', '/usr/bin/chromium-browser'].find(fs.existsSync);
          assert.ok(chrome, 'A preinstalled Chrome/Chromium is required; no browser install is performed');
          const browser = await chromium.launch({ headless: true, executablePath: chrome, args: ['--no-sandbox'] });
          try {
            const context = await browser.newContext({ locale: 'zh-TW', viewport: { width: 1440, height: 900 } });
            await context.route('**/*', route => {
              const url = route.request().url();
              return url.startsWith(origin) || /^(data:|blob:)/.test(url) ? route.continue() : route.abort();
            });
            const page = await context.newPage();
            let errors = [];
            page.on('pageerror', error => errors.push(error.message));
            const snapshot = () => page.evaluate(() => JSON.stringify({
              deck: document.querySelector('#deck')?.getAttribute('style'),
              slides: [...document.querySelectorAll('#deck .slide')].map(e => ({
                cls: e.className, x: Math.round(e.getBoundingClientRect().x), display: getComputedStyle(e).display,
                opacity: getComputedStyle(e).opacity, hidden: e.getAttribute('aria-hidden') })) }));
            for (const theme of themes) {
              errors = [];
              await page.goto(`${origin}/${theme}/index.html`, { waitUntil: 'load' });
              await page.waitForSelector('.imported-theme-root > *', { timeout: 30000 });
              await page.waitForTimeout(1500);
              assert.match(await page.title(), /繁體中文介面驗證/);
              assert.equal(await page.locator('html').getAttribute('lang'), 'zh-TW');
              const visible = await page.locator('body').innerText();
              assert.ok(visible.trim().length > 30, `${theme}: page is not blank`);
              assert.doesNotMatch(visible, /导出|保存|视频|设置|编辑|点击|模块|默认|缩略|简体中文/, `${theme}: simplified UI text`);
              assert.equal(errors.length, 0, `${theme}: ${errors.join('; ')}`);
              const before = await snapshot();
              await page.keyboard.press('ArrowRight');
              await page.waitForTimeout(1200);
              const after = await snapshot();
              assert.notEqual(after, before, `${theme}: next-slide interaction must change page state`);
              if (theme === themes[0]) {
                await page.screenshot({ path: path.join(output, 'desktop-zh-TW.png'), fullPage: false });
                results.controlsSample = await page.locator('button,select').evaluateAll(nodes => nodes.map(n => ({
                  tag: n.tagName, id: n.id, text: n.textContent.trim().slice(0, 100),
                  title: n.title, ariaLabel: n.getAttribute('aria-label') })).slice(0, 60));
                await page.setViewportSize({ width: 390, height: 844 });
                await page.waitForTimeout(700);
                await page.screenshot({ path: path.join(output, 'mobile-zh-TW.png'), fullPage: false });
                await page.setViewportSize({ width: 1440, height: 900 });
              }
              results.checks.push({ theme, language: 'zh-TW', nonBlank: true, noSimplifiedUI: true, pageErrors: errors, nextSlide: true });
            }
            errors = [];
            await page.goto(`${origin}/english/index.html`, { waitUntil: 'load' });
            await page.waitForSelector('.imported-theme-root > *', { timeout: 30000 });
            await page.waitForTimeout(1000);
            assert.equal(await page.locator('html').getAttribute('lang'), 'en');
            assert.match(await page.locator('body').innerText(), /export|reset|slide|theme/i);
            assert.equal(errors.length, 0, errors.join('; '));
            await page.screenshot({ path: path.join(output, 'english-ui.png'), fullPage: false });
            results.englishMode = true;
            results.status = 'passed';
          } finally {
            fs.writeFileSync(path.join(output, 'results.json'), JSON.stringify(results, null, 2));
            console.log(JSON.stringify(results, null, 2));
            await browser.close();
            await new Promise(resolve => server.close(resolve));
          }
          JS
          "$PROJECT/node_modules/.bin/tsx" "$QA_OUTPUT/check.mjs"
      - name: Preserve screenshots and test evidence (no source or font files)
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: zh-TW-browser-evidence
          path: |
            ${{ runner.temp }}/zh-tw-qa/*.png
            ${{ runner.temp }}/zh-tw-qa/results.json
          if-no-files-found: warn
          retention-days: 7
